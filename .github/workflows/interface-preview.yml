name: Sample interface preview
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run build
      - name: Generate only synthetic sample responses and verify the static demo
        run: |
          npx tsx scripts/build-interface-demo.ts /tmp/mansora-interface-preview
          node scripts/interface-demo/check-demo.mjs /tmp/mansora-interface-preview/dist
