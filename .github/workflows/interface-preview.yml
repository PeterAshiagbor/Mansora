name: Sample interface preview
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run build
      - name: Generate only synthetic sample responses and verify the static demo
        run: |
          npx tsx scripts/build-interface-demo.ts /tmp/mansora-interface-preview
          node scripts/interface-demo/check-demo.mjs /tmp/mansora-interface-preview/dist
