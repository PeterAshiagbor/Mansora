name: Independent uptime monitor
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: uptime-monitor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the independent monitor image
        run: docker build -f infrastructure/monitor/Dockerfile -t mansora-independent-monitor:ci .
      - name: Probe an isolated HTTPS fixture as non-root, without real email
        run: bash scripts/monitor/container-smoke.sh mansora-independent-monitor:ci
