name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: mansora_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run build
      - name: Install required PDF content verification tool
        run: apt-get update && apt-get install -y --no-install-recommends poppler-utils
      - name: Install matching browser client and verify provisioned Chromium
        timeout-minutes: 5
        run: |
          npm install --no-save playwright@1.65.0
          node -e "const { chromium } = require('playwright'); (async () => { const browser = await chromium.launch(); await browser.close(); })().catch(() => process.exit(1))"
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Tests (embedded PostgreSQL)
        run: node --test infrastructure/verification.test.mjs && npm run test:verified
      - name: Sync tests against a real PostgreSQL 16 server
        run: npx vitest run tests/sync/sync.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only@postgres:5432/mansora_ci
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  windows-installer:
    name: Windows installer (unsigned) and app smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and package
        run: npm run dist -w @mansora/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch the packaged application and check the secure shell
        run: npm install --no-save playwright && node tests/hardware/electron-smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: mansora-windows-installer-unsigned
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
